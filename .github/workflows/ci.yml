name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, LilyPond ${{ matrix.lilypond }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Every version we support gets its own run, because what the tests read out of an installation changes between versions. Add one here to start testing against it.
        lilypond: ['2.24.3']
    env:
      # Relative to the workspace, so the same value works in bash, in Node and on every runner without any path conversion.
      LILYPOND_TEST_INSTALL_DIR: .lilypond-installs
    steps:
      # No submodule here: type-checking, linting and the tests don't need the language server, which tolerates a missing binary. Skipping it keeps this job off the Rust toolchain entirely.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The tests read files out of a real installation rather than copies checked into the repository, so CI has to supply one.
      - name: Install LilyPond ${{ matrix.lilypond }}
        shell: bash
        run: bash scripts/install-lilypond.sh '${{ matrix.lilypond }}' > /dev/null

      - name: Type-check and lint
        run: npm run check-types && npm run lint

      # The integration tests drive a real VS Code, which needs a display on Linux.
      - name: Test
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a npm test' || 'npm test' }}

  # Builds every platform's package on each push, so a release tag is never the first time we discover that one of them is broken.
  package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - target: linux-x64
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
          - target: darwin-x64
            os: macos-latest
            rust-target: x86_64-apple-darwin
          - target: darwin-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ly-lsp
          # Both macOS targets build on the same runner, so the target has to be part of the cache key.
          key: ${{ matrix.rust-target }}

      - run: npm ci

      - name: Build the language server
        run: cargo build --release --locked --manifest-path ly-lsp/Cargo.toml --target ${{ matrix.rust-target }}

      - name: Stage the language server binary
        shell: bash
        run: |
          mkdir -p server
          cp ly-lsp/target/${{ matrix.rust-target }}/release/ly-lsp${{ runner.os == 'Windows' && '.exe' || '' }} server/

      - name: Package
        run: npx vsce package --target ${{ matrix.target }} --out lilypond-studio-${{ matrix.target }}.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: lilypond-studio-${{ matrix.target }}
          path: lilypond-studio-${{ matrix.target }}.vsix
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # A tag that disagrees with the manifest would publish packages whose filenames and Marketplace version don't match the release, so refuse before anything is public.
      - name: Check the tag matches package.json
        run: |
          tagged=${GITHUB_REF_NAME#v}
          manifest=$(node -p 'require("./package.json").version')
          if [ "$tagged" != "$manifest" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $manifest" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes packages/*.vsix

  # Gated behind `release`, which is where the tag is checked against the manifest.
  publish:
    name: Publish
    needs: [release]
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      # One invocation for every target, so the Marketplace never shows the new version for some platforms and not others. Each vsix carries its own target in the manifest.
      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath packages/*.vsix
